services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: predictapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: predictapi
    ports: ["5433:5432"]  # 5433 en el host para no chocar con el Postgres de otros proyectos
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictapi -d predictapi"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://predictapi:${POSTGRES_PASSWORD}@db:5432/predictapi
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
