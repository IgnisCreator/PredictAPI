name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Credenciales desechables: el contenedor vive solo durante el job
          POSTGRES_USER: predictapi
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: predictapi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U predictapi -d predictapi"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://predictapi:ci-only@localhost:5432/predictapi
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q -rs
      - run: uvx cfn-lint infra/template.yaml infra/github-oidc.yaml
      - run: docker build -t predictapi .

  # Despliega solo desde main y solo si el repositorio tiene configurado el rol de AWS (ver README)
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: production
    permissions:
      id-token: write  # credenciales temporales de AWS vía OIDC, sin claves guardadas
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam build --template-file infra/template.yaml
      - run: >-
          sam deploy --stack-name predictapi --resolve-s3 --resolve-image-repos
          --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset
          --parameter-overrides "DatabaseUrl=\"$DATABASE_URL\""
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Smoke test
        run: |
          url=$(aws cloudformation describe-stacks --stack-name predictapi \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API: ${url}docs" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "${url}ready"
